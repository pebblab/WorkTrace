<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Journal</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>Living Journal</h1><input id="search" type="search" placeholder="Search journal" aria-label="Search journal"><select id="project" aria-label="Project"><option value="">All projects</option></select><button id="new">New Entry</button><button id="archives">Project Archives</button></header>
<nav><label>From <input id="start" type="date"></label><label>To <input id="end" type="date"></label><label><input id="excluded" type="checkbox">Excluded entries</label><button id="overview">Project overview / Keep files</button><button id="drafts">Review drafts</button><button id="importchat">Import conversation</button><button id="rebuild">Rebuild search</button></nav>
<p id="notice" role="status"></p><main id="entries"></main><button id="more">More entries</button>
<dialog id="editor"><form id="editform"><h2 id="editTitle">Entry</h2><label>Headline <input id="headline"></label><div class="row"><label>Project <select id="editproject"></select></label><label>Date/time <input id="date" placeholder="Unknown or YYYY-MM-DDTHH:MM:SS-04:00"></label></div><label>Summary (optional) <input id="summary"></label><label>Entry text <textarea id="text" rows="18" required></textarea></label><div id="editfiles"></div><label><input id="approved" type="checkbox">Approve this historical entry for archiving</label><div class="actions"><button type="submit">Save</button><button type="button" id="cancel">Cancel</button><button type="button" id="exclude">Exclude entry</button></div></form></dialog>
<dialog id="panel"><h2 id="paneltitle"></h2><div id="panelbody"></div><button id="panelclose">Close</button></dialog>
<script src="markdown.js"></script><script src="main.js"></script></body></html>
